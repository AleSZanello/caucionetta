name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m caucionetta --help
      - name: demo smoke test
        env:
          CAUCIONETTA_DEMO: "1"
        run: |
          python -m caucionetta demo
          python -m caucionetta status
          python -m caucionetta --json bot once

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: menubar/app/build.sh
